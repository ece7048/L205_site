<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <style>
      text{font-family:Inter,Arial,sans-serif;letter-spacing:0}
      .title{font-size:78px;font-weight:800;fill:#fff}
      .head{font-size:48px;font-weight:800}
      .copy{font-size:34px;fill:#dce8eb}
      .box{fill:#10232b;stroke:#315763;stroke-width:2;rx:24}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#071015"/>
  <text x="120" y="135" class="title">How do we trust the agent?</text>
  <rect x="125" y="235" width="1670" height="170" class="box"/>
  <text x="175" y="305" class="head" fill="#22c7dd">Validity checks</text>
  <text x="175" y="365" class="copy">Was the task recognised correctly? Were the right inputs and constraints used?</text>
  <rect x="125" y="450" width="1670" height="170" class="box"/>
  <text x="175" y="520" class="head" fill="#ff6b57">Functionality checks</text>
  <text x="175" y="580" class="copy">Unit tests, benchmark cases, regression tests and human review when risk is high.</text>
  <rect x="125" y="665" width="1670" height="170" class="box"/>
  <text x="175" y="735" class="head" fill="#7cc67b">XAI checks</text>
  <text x="175" y="795" class="copy">Feature importance, counterfactuals, saliency, circuits and calibrated uncertainty.</text>
  <text x="125" y="940" class="copy" fill="#fff">Trust is earned by evidence, not by fluent language.</text>
</svg>
